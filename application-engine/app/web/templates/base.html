<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Application Engine{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: -apple-system, system-ui, sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    h1, h2 { margin-top: 1.5em; }
    fieldset { margin-bottom: 1.5rem; border-radius: 8px; }
    label { display: block; margin: 0.6rem 0 0.2rem; font-weight: 600; }
    input[type=text], input[type=number], input[type=email], textarea, select {
      width: 100%; box-sizing: border-box; padding: 0.4rem; font-size: 1rem;
    }
    textarea { font-family: ui-monospace, monospace; }
    .row { display: flex; gap: 1rem; }
    .row > * { flex: 1; }
    .checklist-item { display: flex; align-items: center; gap: 0.5rem; margin: 0.4rem 0; }
    .checklist-item input { width: auto; }
    button { padding: 0.6rem 1.2rem; font-size: 1rem; cursor: pointer; margin-top: 1rem; }
    .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 4px; font-size: 0.8rem; }
    .badge.blocking { background: #f8d7da; color: #842023; }
    .badge.cleared { background: #d1e7dd; color: #0f5132; }
    .badge.needs-human { background: #fff3cd; color: #664d03; }
    pre { white-space: pre-wrap; background: rgba(127,127,127,0.1); padding: 1rem; border-radius: 6px; }
    nav a { margin-right: 1rem; }
    .queue-item { border: 1px solid rgba(127,127,127,0.3); border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    .queue-item h3 { margin: 0 0 0.3rem; }
    .queue-item .meta { color: #666; font-size: 0.9rem; margin-bottom: 0.5rem; }
    .estimate-tag { color: #b42318; font-weight: 600; }
    .needs-metric-tag { color: #b45309; font-style: italic; }
    .action-row { display: flex; gap: 0.6rem; margin-top: 1rem; }
    .action-row button { margin-top: 0; }
    .btn-approve { background: #16a34a; color: white; border: none; border-radius: 6px; }
    .btn-reject { background: #dc2626; color: white; border: none; border-radius: 6px; }
    .btn-neutral { background: rgba(127,127,127,0.15); border: none; border-radius: 6px; }
  </style>
</head>
<body>
  <nav>
    <a href="/">Intake</a>
    <a href="/diagnosis">Diagnosis</a>
    <a href="/run">Run</a>
    <a href="/ready-to-submit">Progress report</a>
    <a href="/applications">Applications</a>
    <a href="/tailoring-issues">Tailoring issues</a>
    <a href="/outreach">Outreach</a>
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
